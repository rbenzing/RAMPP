name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Check: runs on every PR and tag ──────────────────────────────────────
  check:
    name: Lint & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  # ── Release: only on version tags ────────────────────────────────────────
  release:
    name: Build Release Binary
    runs-on: windows-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $cargoToml = Get-Content Cargo.toml -Raw

          # Isolate the [package] section only, so a dependency's own
          # `version = "..."` line (e.g. under [dependencies.windows]) can
          # never be picked up instead of the package's own version.
          if ($cargoToml -notmatch '(?ms)^\[package\]\r?\n(.*?)(?=\r?\n\[|\z)') {
            Write-Error "Could not locate a [package] section in Cargo.toml"
            exit 1
          }
          $packageSection = $Matches[1]

          if ($packageSection -notmatch '(?m)^\s*version\s*=\s*"([^"]+)"') {
            Write-Error "Could not find a version field inside the [package] section of Cargo.toml"
            exit 1
          }
          $cargoVersion = $Matches[1]
          $tagVersion = $env:REF_NAME -replace '^v', ''

          Write-Host "Tag:              $env:REF_NAME (version: $tagVersion)"
          Write-Host "Cargo.toml [package] version: $cargoVersion"

          if ($cargoVersion -ne $tagVersion) {
            Write-Error "Version mismatch: tag '$env:REF_NAME' does not match Cargo.toml [package] version '$cargoVersion'. Bump Cargo.toml's version and push a new commit before re-tagging, or delete/re-push the correct tag."
            exit 1
          }

          Write-Host "OK: tag version matches Cargo.toml version ($cargoVersion)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release

      - name: Rename binary with version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME
          $src = "target\release\rampp.exe"
          $dst = "rampp-${version}-windows-x64.exe"
          Copy-Item $src $dst
          Write-Host "Created: $dst"

      - name: Generate SHA-256 checksum
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME
          $file = "rampp-${version}-windows-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -Encoding ascii "${file}.sha256"
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RAMPP ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Installation

            1. Download `rampp-${{ github.ref_name }}-windows-x64.exe` and place it at `C:\rampp\rampp.exe`
            2. Extract [Apache 2.4 (Win64, VS17)](https://www.apachelounge.com/download/) into `C:\rampp\apache\`
            3. Extract [MySQL 9.x (ZIP)](https://dev.mysql.com/downloads/mysql/) into `C:\rampp\mysql\`
            4. Extract [PHP 8.x Thread Safe (ZIP)](https://windows.php.net/download/) into `C:\rampp\php\` so `php-cgi.exe` ends up at `C:\rampp\php\php-cgi.exe`
            5. Optional — extract [phpMyAdmin](https://www.phpmyadmin.net/downloads/) into `C:\rampp\phpmyadmin\` to enable the built-in admin toggle
            6. Install [Visual C++ Redistributable 2022 x64](https://aka.ms/vs/17/release/vc_redist.x64.exe)
            7. Run `rampp.exe` — first-launch provisioning is automatic

            Verify the download with the `.sha256` file:
            ```powershell
            Get-FileHash rampp-${{ github.ref_name }}-windows-x64.exe -Algorithm SHA256
            ```

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          files: |
            rampp-${{ github.ref_name }}-windows-x64.exe
            rampp-${{ github.ref_name }}-windows-x64.exe.sha256
